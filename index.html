```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #273469 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #3b1d5a 0, transparent 35%),
        #090a0f;
      color: #fff;
    }

    .calculator {
      width: min(100%, 380px);
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(20, 21, 29, 0.78);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
    }

    .display {
      min-height: 145px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .previous {
      min-height: 28px;
      width: 100%;
      text-align: right;
      color: #858894;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current {
      width: 100%;
      text-align: right;
      font-size: clamp(2.5rem, 10vw, 3.7rem);
      font-weight: 600;
      letter-spacing: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    button {
      height: 68px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: #20222b;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);
    }

    button:hover {
      background: #292c37;
    }

    button:active {
      transform: scale(0.94);
    }

    .operator {
      background: #292b39;
      color: #aeb4ff;
    }

    .operator:hover {
      background: #34374a;
    }

    .action {
      color: #ff8585;
      background: #27252d;
    }

    .equals {
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      box-shadow: 0 8px 25px rgba(108, 99, 255, 0.3);
    }

    .equals:hover {
      background: linear-gradient(135deg, #7a72ff, #986cff);
    }

    .zero {
      grid-column: span 2;
    }

    @media (max-width: 420px) {
      .calculator {
        padding: 16px;
        border-radius: 24px;
      }

      button {
        height: 62px;
        border-radius: 16px;
      }

      .display {
        min-height: 125px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">
    <section class="display" aria-live="polite">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>

    <section class="keys">
      <button class="action" data-action="clear">AC</button>
      <button class="action" data-action="delete">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
  </main>

  <script>
    const currentDisplay = document.querySelector("#current");
    const previousDisplay = document.querySelector("#previous");
    const keys = document.querySelector(".keys");

    let current = "0";
    let previous = "";
    let operator = null;
    let resetScreen = false;

    const updateDisplay = () => {
      currentDisplay.textContent = current;
      previousDisplay.textContent =
        previous && operator ? `${previous} ${displayOperator(operator)}` : "";
    };

    const displayOperator = op => ({
      "*": "×",
      "/": "÷",
      "-": "−",
      "+": "+"
    }[op] || op);

    const inputNumber = number => {
      if (current === "Error" || resetScreen) {
        current = number;
        resetScreen = false;
      } else {
        current = current === "0" ? number : current + number;
      }

      updateDisplay();
    };

    const inputDecimal = () => {
      if (resetScreen) {
        current = "0.";
        resetScreen = false;
      } else if (!current.includes(".")) {
        current += ".";
      }

      updateDisplay();
    };

    const chooseOperator = nextOperator => {
      if (current === "Error") return;

      if (operator && !resetScreen) {
        calculate();
      }

      previous = current;
      operator = nextOperator;
      resetScreen = true;

      updateDisplay();
    };

    const calculate = () => {
      if (!operator || previous === "") return;

      const a = Number(previous);
      const b = Number(current);

      let result;

      switch (operator) {
        case "+":
          result = a + b;
          break;
        case "-":
          result = a - b;
          break;
        case "*":
          result = a * b;
          break;
        case "/":
          result = b === 0 ? "Error" : a / b;
          break;
      }

      if (result === "Error") {
        current = "Error";
      } else {
        current = String(Number(result.toFixed(12)));
      }

      previous = "";
      operator = null;
      resetScreen = true;

      updateDisplay();
    };

    const clearCalculator = () => {
      current = "0";
      previous = "";
      operator = null;
      resetScreen = false;
      updateDisplay();
    };

    const deleteLast = () => {
      if (resetScreen || current === "Error") {
        current = "0";
        resetScreen = false;
      } else {
        current = current.length > 1
          ? current.slice(0, -1)
          : "0";
      }

      updateDisplay();
    };

    const percentage = () => {
      if (current === "Error") return;

      current = String(Number(current) / 100);
      updateDisplay();
    };

    keys.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      const { value, action } = button.dataset;

      if (action === "clear") clearCalculator();
      else if (action === "delete") deleteLast();
      else if (action === "equals") calculate();
      else if (value === "%") percentage();
      else if (value === ".") inputDecimal();
      else if ("+-*/".includes(value)) chooseOperator(value);
      else inputNumber(value);
    });

    document.addEventListener("keydown", event => {
      const key = event.key;

      if (/^\d$/.test(key)) inputNumber(key);
      else if (key === ".") inputDecimal();
      else if ("+-*/".includes(key)) chooseOperator(key);
      else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
      }
      else if (key === "Backspace") deleteLast();
      else if (key === "Escape") clearCalculator();
      else if (key === "%") percentage();
    });

    updateDisplay();
  </script>

</body>
</html>
